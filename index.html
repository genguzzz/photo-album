<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ijoy 北京国际会议中心 2025-0727</title>
<style>
  :root {
    --bg: #0a0a0b;
    --card: #121214;
    --border: #1f1f23;
    --text: #eaeaea;
    --muted: #8a8a93;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header { padding: 48px 20px 24px; text-align: center; }
  header h1 { font-size: 26px; font-weight: 600; letter-spacing: 3px; }
  header p { margin-top: 10px; font-size: 13px; color: var(--muted); letter-spacing: 1px; }
  .count { display: inline-block; margin-top: 14px; padding: 4px 16px; border: 1px solid var(--border); border-radius: 20px; font-size: 12px; color: var(--muted); }

  .grid { columns: 4 280px; column-gap: 14px; padding: 18px 22px 56px; max-width: 1440px; margin: 0 auto; }
  .item {
    break-inside: avoid;
    margin-bottom: 14px;
    border-radius: 8px;
    overflow: hidden;
    background: var(--card);
    position: relative;
    cursor: zoom-in;
  }
  .item img { display: block; width: 100%; height: auto; }
  .item .overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,.78) 0%, rgba(0,0,0,.15) 45%, transparent 65%);
    opacity: 0; transition: opacity .3s ease;
  }
  .item .info {
    position: absolute; left: 10px; right: 10px; bottom: 10px; color: #fff;
    opacity: 0; transition: opacity .3s ease;
  }
  .item .info .file { font-size: 11px; color: rgba(255,255,255,.75); margin-bottom: 6px; font-family: ui-monospace, monospace; }
  .item .info .exif { display: flex; flex-wrap: wrap; gap: 4px; }
  .item .info .exif span {
    font-size: 10px; padding: 2px 7px; border-radius: 4px;
    background: rgba(255,255,255,.18); backdrop-filter: blur(6px);
  }

  /* 桌面 hover */
  @media (hover: hover) {
    .item:hover .overlay { opacity: 1; }
    .item:hover .info { opacity: 1; }
  }
  /* 移动端/触屏：常显 EXIF 徽标，无需 hover */
  @media (hover: none) {
    .item .overlay {
      opacity: 1;
      background: linear-gradient(to top, rgba(0,0,0,.72) 0%, rgba(0,0,0,.12) 38%, transparent 55%);
    }
    .item .info { opacity: 1; }
    .item .info .exif span { background: rgba(0,0,0,.55); }
  }

  /* --- Viewer --- */
  .viewer {
    position: fixed; inset: 0; z-index: 200;
    background: #050506;
    display: none;
    flex-direction: column;
  }
  .viewer.show { display: flex; }
  .viewer .topbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 30;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px;
    background: linear-gradient(to bottom, rgba(0,0,0,.6), transparent);
  }
  .viewer .topbar .idx { font-size: 13px; color: rgba(255,255,255,.8); }
  .vbtn {
    width: 42px; height: 42px; border-radius: 50%;
    border: none; cursor: pointer;
    background: rgba(255,255,255,.1); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; transition: background .2s;
  }
  .vbtn:active { background: rgba(255,255,255,.3); }
  .vbtn.hidden { visibility: hidden; }

  .viewer .stage {
    flex: 1; position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    touch-action: pan-x pan-y;
    cursor: zoom-in;
  }
  .stage .slide {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    transition: transform .25s ease;
  }
  .stage .slide.zoomed { cursor: zoom-out; }
  }
  .stage .slide img {
    max-width: 100%; max-height: 100%;
    object-fit: contain;
    user-select: none; -webkit-user-drag: none;
  }
  .slide.anim img { animation: zoomIn .22s ease; }
  @keyframes zoomIn { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: scale(1); } }
  .slide.fly-left { transform: translateX(-12%); opacity: 0; transition: transform .2s ease, opacity .2s ease; }
  .slide.fly-right { transform: translateX(12%); opacity: 0; transition: transform .2s ease, opacity .2s ease; }

  .navbtn {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px; border-radius: 50%;
    border: none; cursor: pointer; z-index: 30;
    background: rgba(255,255,255,.12); color: #fff;
    font-size: 22px; display: flex; align-items: center; justify-content: center;
  }
  .navbtn:active { background: rgba(255,255,255,.3); }
  .navbtn.prev { left: 14px; }
  .navbtn.next { right: 14px; }
  .navbtn.off { display: none; }

  /* 移动端底部信息条 */
  .info-bar {
    display: none;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: rgba(15,15,18,.97);
    border-top: 1px solid var(--border);
  }
  .info-bar .cam { font-size: 13px; font-weight: 500; }
  .info-bar .exif { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .info-bar .exif span {
    font-size: 11px; padding: 2px 8px; border-radius: 5px;
    background: rgba(255,255,255,.09);
  }

  /* 桌面侧栏 */
  .side {
    position: absolute; top: 0; right: 0; bottom: 0; z-index: 20;
    width: 320px; border-left: 1px solid var(--border);
    background: rgba(16,16,19,.97); backdrop-filter: blur(12px);
    overflow-y: auto; padding: 64px 24px 28px;
    transform: translateX(100%); transition: transform .25s ease;
  }
  .side.open { transform: translateX(0); }
  .side h2 { font-size: 19px; font-weight: 600; margin-bottom: 6px; }
  .side .camera { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .side .lens { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
  .side .exif-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .side .exif-cell { background: rgba(255,255,255,.05); border-radius: 8px; padding: 12px; text-align: center; }
  .side .exif-cell .k { font-size: 11px; color: var(--muted); }
  .side .exif-cell .v { font-size: 14px; font-weight: 500; margin-top: 4px; }
  .side .date { font-size: 12px; color: var(--muted); margin-top: 20px; }
  .side .detail { font-size: 13px; color: rgba(255,255,255,.75); margin-top: 16px; line-height: 1.7; }

  @media (max-width: 820px) {
    .grid { columns: 2 140px; column-gap: 10px; padding: 12px 10px 40px; }
    .item { margin-bottom: 10px; }
    header { padding: 32px 16px 18px; }
    header h1 { font-size: 20px; }
    .side { display: none; }
    .info-bar { display: block; }
    .viewer .topbar .idx { margin: 0 auto; }
    /* 移动端也显示左右箭头引导（半透明、较细） */
    .navbtn {
      display: flex;
      width: 38px; height: 38px;
      background: rgba(255,255,255,.14);
      font-size: 20px;
    }
    .navbtn.prev { left: 8px; }
    .navbtn.next { right: 8px; }
  }
</style>
</head>
<body>
  <header>
    <h1>Ijoy 北京国际会议中心 2025-0727</h1>
    <p>Sony ILCE-6700 · E 18-135mm</p>
    <span class="count" id="count"></span>
  </header>

  <div class="grid" id="grid"></div>

  <!-- Photo viewer -->
  <div class="viewer" id="viewer">

    </div>
    <div class="stage" id="stage">
      <button class="navbtn prev" id="btnPrev">‹</button>
      <button class="navbtn next" id="btnNext">›</button>
      <div class="slide" id="slide"></div>
    </div>
    <aside class="side" id="side">
      <h2 id="sTitle"></h2>
      <p class="camera" id="sCamera"></p>
      <p class="lens" id="sLens"></p>
      <div class="exif-grid" id="sExif"></div>
      <p class="date" id="sDate"></p>
      <p class="detail" id="sDetail"></p>
    </aside>
    <div class="info-bar" id="infoBar">
      <div class="cam" id="iCam"></div>
      <div class="exif" id="iExif"></div>
    </div>
  </div>

const grid = document.getElementById('grid');
const countEl = document.getElementById('count');
countEl.textContent = '共 ' + PHOTOS.length + ' 张';

// 预加载：滑动方向上一张/下一张
const preloader = new Map();
function preload(url) {
  if (!url || preloader.has(url)) return;
  const im = new Image();
  im.src = url;
  preloader.set(url, im);
}

// ---- build masonry grid ----
PHOTOS.forEach((p, i) => {
  const item = document.createElement('div');
  item.className = 'item';

  const img = document.createElement('img');
  img.src = p.preview;
  img.alt = '';
  img.loading = 'lazy';
  img.style.aspectRatio = p.w + '/' + p.h;
  img.draggable = false;

  const ov = document.createElement('div');
  ov.className = 'overlay';

  const info = document.createElement('div');
  info.className = 'info';
  const file = document.createElement('div');
  file.className = 'file';
  file.textContent = p.url.split('/').pop();
  info.appendChild(file);
  if (p.exif) {
    const ex = document.createElement('div');
    ex.className = 'exif';
    const add = (v) => {
      const s = document.createElement('span');
      s.textContent = v;
      ex.appendChild(s);
    };
    if (p.exif.focal_length) add(p.exif.focal_length);
    if (p.exif.f_number) add(p.exif.f_number);
    if (p.exif.exposure_time) add(p.exif.exposure_time);
    if (p.exif.iso_speed_rating) add('ISO ' + p.exif.iso_speed_rating);
    if (ex.children.length) info.appendChild(ex);
  }
  item.append(img, ov, info);
  item.addEventListener('click', () => openViewer(i));
  grid.appendChild(item);
});

// ---- viewer ----
const viewer = document.getElementById('viewer');
const stage = document.getElementById('stage');
const slide = document.getElementById('slide');
const side = document.getElementById('side');
let cur = 0, showSide = false, isMobile = window.matchMedia('(max-width: 820px)').matches;

function fmt(n) { return n ? n : ''; }

function exifCells(p) {
  return [
    ['焦距', fmt(p.exif?.focal_length)],
    ['光圈', fmt(p.exif?.f_number)],
    ['快门', fmt(p.exif?.exposure_time)],
    ['ISO', fmt(p.exif?.iso_speed_rating)],
  ].filter(c => c[1]);
}

function renderViewer(p) {
  document.getElementById('idx').textContent = (cur + 1) + ' / ' + PHOTOS.length;
  // 侧栏
  document.getElementById('sTitle').textContent = p.title || p.url.split('/').pop();
  document.getElementById('sCamera').textContent = [p.exif?.make, p.exif?.model].filter(Boolean).join(' ') || '';
  document.getElementById('sLens').textContent = p.exif?.lens_model || '';
  const g = document.getElementById('sExif');
  g.innerHTML = '';
  exifCells(p).forEach(([k, v]) => {
    const d = document.createElement('div');
    d.className = 'exif-cell';
    d.innerHTML = '<div class="k">' + k + '</div><div class="v">' + v + '</div>';
    g.appendChild(d);
  });
  document.getElementById('sDate').textContent = p.exif?.dateTime || '';
  document.getElementById('sDetail').textContent = p.detail || '';
  // 移动端信息条
  document.getElementById('iCam').textContent = [p.exif?.make, p.exif?.model].filter(Boolean).join(' ') + ' · ' + (p.exif?.lens_model || '');
  const ie = document.getElementById('iExif');
  ie.innerHTML = '';
  exifCells(p).forEach(([k, v]) => {
    const s = document.createElement('span');
    s.textContent = k + ' ' + v;
    ie.appendChild(s);
  });
}

function openViewer(i) {
  cur = i;
  resetZoom();
  const p = PHOTOS[cur];
  slide.innerHTML = '';
  const img = document.createElement('img');
  img.src = p.url;
  img.draggable = false;
  img.className = 'anim';
  slide.appendChild(img);
  renderViewer(p);
  updateNav();
  viewer.classList.add('show');
  document.body.style.overflow = 'hidden';
  preload(PHOTOS[cur+1]?.url);
  preload(PHOTOS[cur-1]?.url);
}

function closeViewer() {
  resetZoom();
  viewer.classList.remove('show');
  document.body.style.overflow = '';
}

function updateNav() {
  document.getElementById('btnPrev').classList.toggle('off', cur <= 0);
  document.getElementById('btnNext').classList.toggle('off', cur >= PHOTOS.length - 1);
}

function go(i, dir) {
  if (i < 0 || i >= PHOTOS.length) return;
  if (i === cur) return;
  cur = i;
  const p = PHOTOS[cur];
  const img = document.createElement('img');
  img.src = p.url;
  img.draggable = false;
  img.className = 'anim';
  slide.innerHTML = '';
  slide.appendChild(img);
  renderViewer(p);
  updateNav();
  preload(PHOTOS[cur+1]?.url);
  preload(PHOTOS[cur-1]?.url);
}

// 按钮
document.getElementById('btnClose').addEventListener('click', closeViewer);
document.getElementById('btnPrev').addEventListener('click', e => { e.stopPropagation(); go(cur - 1); });
document.getElementById('btnNext').addEventListener('click', e => { e.stopPropagation(); go(cur + 1); });
document.getElementById('btnInfo').addEventListener('click', e => {
  e.stopPropagation();
  showSide = !showSide;
  side.classList.toggle('open', showSide);
});
stage.addEventListener('click', e => {
  if (e.target === stage) closeViewer();
});

// 键盘导航
document.addEventListener('keydown', e => {
  if (!viewer.classList.contains('show')) return;
  if (e.key === 'Escape') closeViewer();
  if (e.key === 'ArrowLeft') go(cur - 1);
  if (e.key === 'ArrowRight') go(cur + 1);
});

// 触摸：单指滑动翻页 + 双指捏合缩放 + 双击放大 + 放大后拖动
let touchX = 0, touchY = 0, dragging = false;
let pinchDist = 0, pinchStartZoom = 1, zoomLevel = 1;
const MIN_ZOOM = 1, MAX_ZOOM = 4;

function setZoom(level) {
  zoomLevel = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, level));
  const img = slide.querySelector('img');
  if (!img) return;
  if (zoomLevel === 1) {
    slide.classList.remove('zoomed');
    slide.style.transform = '';
  } else {
    slide.classList.add('zoomed');
    slide.style.transform = 'scale(' + zoomLevel + ')';
  }
}

function resetZoom() {
  zoomLevel = 1;
  slide.classList.remove('zoomed');
  slide.style.transform = '';
  slide.dataset.tx = 0; slide.dataset.ty = 0;
}

function pinchDistOf(e) {
  const dx = e.touches[0].clientX - e.touches[1].clientX;
  const dy = e.touches[0].clientY - e.touches[1].clientY;
  return Math.hypot(dx, dy);
}

stage.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    pinchDist = pinchDistOf(e);
    pinchStartZoom = zoomLevel;
    dragging = false;
    return;
  }
  if (e.touches.length === 1) {
    const t = e.touches[0];
    touchX = t.clientX; touchY = t.clientY;
    dragging = true;
  }
}, { passive: true });

stage.addEventListener('touchmove', e => {
  if (e.touches.length === 2) {
    e.preventDefault();
    const d = pinchDistOf(e);
    if (pinchDist > 0) {
      setZoom(pinchStartZoom * (d / pinchDist));
    }
    return;
  }
  if (!dragging || e.touches.length !== 1) return;
  if (zoomLevel > 1) {
    // 放大状态：单指拖动图片平移
    e.preventDefault();
    const t = e.touches[0];
    const dx = t.clientX - touchX;
    const dy = t.clientY - touchY;
    const tx = slide.dataset.tx ? parseFloat(slide.dataset.tx) : 0;
    const ty = slide.dataset.ty ? parseFloat(slide.dataset.ty) : 0;
    slide.dataset.tx = tx + dx; slide.dataset.ty = ty + dy;
    slide.style.transform = 'scale(' + zoomLevel + ') translate(' + slide.dataset.tx + 'px,' + slide.dataset.ty + 'px)';
    touchX = t.clientX; touchY = t.clientY;
    return;
  }
  const dx = e.touches[0].clientX - touchX;
  const dy = e.touches[0].clientY - touchY;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    dragging = false;
    if (dx < 0) go(cur + 1); else go(cur - 1);
  }
}, { passive: false });

stage.addEventListener('touchend', () => {
  dragging = false;
  pinchDist = 0;
});

// 双击放大/还原（桌面）
stage.addEventListener('dblclick', e => {
  e.preventDefault();
  setZoom(zoomLevel > 1 ? 1 : 2.5);
});

// 双击放大/还原（移动端 tap 检测）
let lastTap = 0;
stage.addEventListener('touchend', e => {
  if (e.touches.length === 0 && Date.now() - lastTap < 300) {
    e.preventDefault();
    setZoom(zoomLevel > 1 ? 1 : 2.5);
    lastTap = 0;
    return;
  }
  lastTap = Date.now();
});

// 切图时重置缩放
const origGo = go;
go = function(i) {
  resetZoom();
  origGo(i);
};
</script>
</body>
