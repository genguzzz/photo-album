  * { margin: 0; padding: 0; box-sizing: border-box; }

    min-height: 100vh;
  }
  header { padding: 48px 24px 24px; text-align: center; }
  header h1 { font-size: 26px; font-weight: 600; letter-spacing: 2px; color: #fff; }
  header p { margin-top: 8px; font-size: 14px; color: #8a8a93; letter-spacing: 1px; }

  .grid { columns: 4 280px; column-gap: 14px; padding: 24px 24px 60px; max-width: 1440px; margin: 0 auto; }
  .item {
    break-inside: avoid;
    margin-bottom: 14px;
    border-radius: 10px;
    overflow: hidden;
    background: #1a1a21;
    position: relative;
    cursor: zoom-in;
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .item:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(0,0,0,.5); }
  .item img { display: block; width: 100%; height: auto; }
  .item .cap {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 20px 10px 8px;
    background: linear-gradient(transparent, rgba(0,0,0,.7));
    font-size: 12px; color: #ddd;
    opacity: 0; transition: opacity .2s;
  }
  .item:hover .cap { opacity: 1; }

  .overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,.92);
    display: none; align-items: center; justify-content: center; flex-direction: column;
    cursor: zoom-out;
  }
  .overlay.show { display: flex; }
  .overlay img { max-width: 96vw; max-height: 90vh; border-radius: 6px; box-shadow: 0 20px 60px rgba(0,0,0,.7); }
  .overlay .cap { margin-top: 14px; font-size: 13px; color: #9a9aa5; letter-spacing: 1px; }
  .overlay .nav { margin-top: 10px; font-size: 13px; color: #666; }

  @media (max-width: 720px) {
    .grid { columns: 2 140px; column-gap: 10px; padding: 14px 12px 40px; }
    .item { margin-bottom: 10px; }
    header { padding: 32px 16px 16px; }
    header h1 { font-size: 20px; }
  }

    <img id="ovImg" src="" alt="">
    <div class="cap" id="ovCap"></div>
    <div class="nav" id="ovNav"></div>
  </div>

<script>
  const items = Array.from(document.querySelectorAll('.item'));
  const ov = document.getElementById('ov');
  const ovImg = document.getElementById('ovImg');
  const ovCap = document.getElementById('ovCap');
  const ovNav = document.getElementById('ovNav');
  let cur = 0;

  function show(i) {
    cur = (i + items.length) % items.length;
    const it = items[cur];
    ovImg.src = it.dataset.src;
    ovImg.loading = 'eager';
    ovCap.textContent = it.querySelector('img').alt || '';
    ovNav.textContent = (cur + 1) + ' / ' + items.length;
    ov.classList.add('show');
  }
  items.forEach((it, i) => it.addEventListener('click', () => show(i)));
  ov.addEventListener('click', () => ov.classList.remove('show'));
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') ov.classList.remove('show');
    if (ov.classList.contains('show')) {
      if (e.key === 'ArrowRight') show(cur + 1);
      if (e.key === 'ArrowLeft') show(cur - 1);
    }
  });
</script>
