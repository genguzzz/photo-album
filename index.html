<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ijoy 北京国际会议中心 2025-0727</title>
<style>
  :root {
    --bg: #0a0a0b;
    --card: #121214;
    --border: #1f1f23;
    --text: #eaeaea;
    --muted: #8a8a93;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header { padding: 56px 24px 28px; text-align: center; }
  header h1 { font-size: 28px; font-weight: 600; letter-spacing: 3px; }
  header p { margin-top: 10px; font-size: 13px; color: var(--muted); letter-spacing: 1px; }
  .count { display: inline-block; margin-top: 16px; padding: 4px 16px; border: 1px solid var(--border); border-radius: 20px; font-size: 12px; color: var(--muted); }

  .grid { columns: 4 280px; column-gap: 14px; padding: 20px 24px 60px; max-width: 1440px; margin: 0 auto; }
  .item {
    break-inside: avoid;
    margin-bottom: 14px;
    border-radius: 8px;
    overflow: hidden;
    background: var(--card);
    position: relative;
    cursor: zoom-in;
  }
  .item img { display: block; width: 100%; height: auto; }
  .item .overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,.75) 0%, rgba(0,0,0,.15) 40%, transparent 60%);
    opacity: 0;
    transition: opacity .3s ease;
  }
  .item:hover .overlay { opacity: 1; }
  .item .info { position: absolute; left: 12px; right: 12px; bottom: 12px; color: #fff; opacity: 0; transition: opacity .3s ease .05s; }
  .item:hover .info { opacity: 1; }
  .item .info h3 { font-size: 13px; font-weight: 500; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .info .exif { display: flex; flex-wrap: wrap; gap: 5px; }
  .item .info .exif span {
    font-size: 10px; padding: 2px 7px; border-radius: 4px;
    background: rgba(255,255,255,.16); backdrop-filter: blur(6px);
  }
  .item .badge {
    position: absolute; top: 8px; left: 8px;
    font-size: 10px; padding: 2px 8px; border-radius: 999px;
    background: rgba(0,0,0,.5); color: #fff; backdrop-filter: blur(4px);
    display: none;
  }
  .item .badge.show { display: block; }

  /* --- Viewer --- */
  .viewer {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(8,8,10,.96); backdrop-filter: blur(8px);
    display: none;
  }
  .viewer.show { display: flex; }
  .viewer .main { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .viewer .main img {
    max-width: 92vw; max-height: 92vh;
    object-fit: contain;
    border-radius: 4px;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
  }
  .viewer .main img.anim { animation: zoomIn .25s ease; }
  @keyframes zoomIn { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: scale(1); } }
  .vbtn {
    position: absolute;
    width: 40px; height: 40px; border-radius: 50%;
    border: none; cursor: pointer;
    background: rgba(255,255,255,.08); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; transition: background .2s;
    z-index: 10;
  }
  .vbtn:hover { background: rgba(255,255,255,.18); }
  .vbtn.close { top: 16px; left: 16px; }
  .vbtn.info { top: 16px; right: 16px; font-size: 15px; }
  .vbtn.prev { left: 20px; top: 50%; transform: translateY(-50%); }
  .vbtn.next { right: 20px; top: 50%; transform: translateY(-50%); }
  .vbtn.off { display: none; }

  .side {
    width: 340px; border-left: 1px solid var(--border);
    background: var(--card);
    overflow-y: auto;
    padding: 32px 28px;
  }
  .side h2 { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
  .side .camera { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .side .lens { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
  .side .exif-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .side .exif-cell { background: rgba(255,255,255,.05); border-radius: 8px; padding: 12px; text-align: center; }
  .side .exif-cell .k { font-size: 11px; color: var(--muted); }
  .side .exif-cell .v { font-size: 14px; font-weight: 500; margin-top: 4px; }
  .side .date { font-size: 12px; color: var(--muted); margin-top: 20px; }
  .side .detail { font-size: 13px; color: rgba(255,255,255,.75); margin-top: 16px; line-height: 1.7; }
  .side .hidden { display: none; }

  @media (max-width: 720px) {
    .grid { columns: 2 140px; column-gap: 10px; padding: 14px 12px 40px; }
    .item { margin-bottom: 10px; }
    header { padding: 36px 16px 20px; }
    header h1 { font-size: 21px; }
    .side { display: none; }
    .vbtn.prev { left: 8px; } .vbtn.next { right: 8px; }
  }
</style>
</head>

18-135mm F3.5-5.6 OSS", "color_space": "sRGB", "focal_length": "109 mm", "exposure_mode": "Manual exposure", "exposure_time": "1/400", "white_balance": "Auto white balance", "exposure_program": "Manual", "iso_speed_rating": 5000, "lens_specification": "18-135 mm f/5.6"}}, {"url": "https://pic.gugenzzz.top/anime/cc/DSC01234.jpg", "preview": "https://pic.gugenzzz.top/anime/cc/preview/DSC01234.webp", "w": 4096, "h": 2731, "title": "", "detail": "", "exif": {"bits": "8", "make": "SONY", "model": "ILCE-6700", "dateTime": "2024:07:27 02:13:42", "f_number": "f/5.6", "lens_model": "E 18-135mm F3.5-5.6 OSS", "color_space": "sRGB", "focal_length": "135 mm", "exposure_mode": "Manual exposure", "exposure_time": "1/160", "white_balance": "Auto white balance", "exposure_program": "Manual", "iso_speed_rating": 1250, "lens_specification": "18-135 mm f/5.6"}}, {"url": "https://pic.gugenzzz.top/anime/cc/DSC01374.jpg", "preview": "https://pic.gugenzzz.top/anime/cc/preview/DSC01374.webp", "w": 4096, "h": 2731, "title": "", "detail": "", "exif": {"bits": "8", "make": "SONY", "model": "ILCE-6700", "dateTime": "2024:07:27 02:47:01", "f_number": "f/5.6", "lens_model": "E 18-135mm F3.5-5.6 OSS", "color_space": "sRGB", "focal_length": "135 mm", "exposure_mode": "Manual exposure", "exposure_time": "1/200", "white_balance": "Auto white balance", "exposure_program": "Manual", "iso_speed_rating": 500, "lens_specification": "18-135 mm f/5.6"}}, {"url": "https://pic.gugenzzz.top/anime/cc/DSC01203.jpg", "preview": "https://pic.gugenzzz.top/anime/cc/preview/DSC01203.webp", "w": 2731, "h": 4096, "title": "", "detail": "", "exif": {"bits": "8", "make": "SONY", "model": "ILCE-6700", "dateTime": "2024:07:27 02:04:09", "f_number": "f/5.6", "lens_model": "E 18-135mm F3.5-5.6 OSS", "color_space": "sRGB", "focal_length": "135 mm", "exposure_mode": "Manual exposure", "exposure_time": "1/160", "white_balance": "Auto white balance", "exposure_program": "Manual", "iso_speed_rating": 500, "lens_specification": "18-135 mm f/5.6"}}, {"url": "https://pic.gugenzzz.top/anime/cc/DSC01209.jpg", "preview": "https://pic.gugenzzz.top/anime/cc/preview/DSC01209.webp", "w": 2731, "h": 4096, "title": "", "detail": "", "exif": {"bits": "8", "make": "SONY", "model": "ILCE-6700", "dateTime": "2024:07:27 02:04:20", "f_number": "f/5.6", "lens_model": "E 18-135mm F3.5-5.6 OSS", "color_space": "sRGB", "focal_length": "135 mm", "exposure_mode": "Manual exposure", "exposure_time": "1/160", "white_balance": "Auto white balance", "exposure_program": "Manual", "iso_speed_rating": 500, "lens_specification": "18-135 mm f/5.6"}}];
const grid = document.getElementById('grid');
const countEl = document.getElementById('count');
countEl.textContent = '共 ' + PHOTOS.length + ' 张';

// ---- build masonry grid (PicImpact masonry-photo-item 风格) ----
PHOTOS.forEach((p, i) => {
  const item = document.createElement('div');
  item.className = 'item';
  item.dataset.i = i;

  const img = document.createElement('img');
  img.src = p.preview;
  img.alt = p.title || '';
  img.loading = 'lazy';
  img.style.aspectRatio = p.w + '/' + p.h;

  const ov = document.createElement('div');
  ov.className = 'overlay';

  const info = document.createElement('div');
  info.className = 'info';
  const h3 = document.createElement('h3');
  h3.textContent = p.title || p.url.split('/').pop();
  info.appendChild(h3);
  if (p.exif) {
    const ex = document.createElement('div');
    ex.className = 'exif';
    const add = (v) => {
      const s = document.createElement('span');
      s.textContent = v;
      ex.appendChild(s);
    };
    if (p.exif.focal_length) add(p.exif.focal_length);
    if (p.exif.f_number) add(p.exif.f_number);
    if (p.exif.exposure_time) add(p.exif.exposure_time);
    if (p.exif.iso_speed_rating) add('ISO ' + p.exif.iso_speed_rating);
    if (ex.children.length) info.appendChild(ex);
  }
  item.append(img, ov, info);
  item.addEventListener('click', () => openViewer(i));
  grid.appendChild(item);
});

// ---- viewer (PicImpact photo-viewer 风格) ----
const viewer = document.getElementById('viewer');
const vimg = document.getElementById('vimg');
const side = document.getElementById('side');
let cur = 0, showSide = true;

function fmt(n) { return n ? n : ''; }

function renderSide(p) {
  document.getElementById('sTitle').textContent = p.title || '';
  const cam = [p.exif?.make, p.exif?.model].filter(Boolean).join(' ');
  document.getElementById('sCamera').textContent = cam;
  document.getElementById('sLens').textContent = p.exif?.lens_model || '';
  const g = document.getElementById('sExif');
  g.innerHTML = '';
  const cells = [
    ['Focal Length', fmt(p.exif?.focal_length)],
    ['Aperture', fmt(p.exif?.f_number)],
    ['Shutter', fmt(p.exif?.exposure_time)],
    ['ISO', fmt(p.exif?.iso_speed_rating)],
  ].filter(c => c[1]);
  cells.forEach(([k, v]) => {
    const d = document.createElement('div');
    d.className = 'exif-cell';
    d.innerHTML = '<div class="k">' + k + '</div><div class="v">' + v + '</div>';
    g.appendChild(d);
  });
  document.getElementById('sDate').textContent = p.exif?.dateTime || '';
  document.getElementById('sDetail').textContent = p.detail || '';
}

function openViewer(i) {
  cur = i;
  const p = PHOTOS[cur];
  vimg.src = p.url;
  vimg.className = 'anim';
  renderSide(p);
  side.classList.toggle('hidden', !showSide);
  document.getElementById('btnInfo').classList.toggle('hidden', false);
  updateNav();
  viewer.classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeViewer() {
  viewer.classList.remove('show');
  document.body.style.overflow = '';
}
function updateNav() {
  document.getElementById('btnPrev').classList.toggle('off', cur <= 0);
  document.getElementById('btnNext').classList.toggle('off', cur >= PHOTOS.length - 1);
  document.getElementById('btnInfo').classList.toggle('hidden', false);
}
function go(i) {
  cur = (i + PHOTOS.length) % PHOTOS.length;
  const p = PHOTOS[cur];
  vimg.className = '';
  void vimg.offsetWidth; // restart animation
  vimg.src = p.url;
  vimg.className = 'anim';
  renderSide(p);
  updateNav();
}

document.getElementById('btnClose').addEventListener('click', closeViewer);
document.getElementById('btnPrev').addEventListener('click', () => go(cur - 1));
document.getElementById('btnNext').addEventListener('click', () => go(cur + 1));
document.getElementById('btnInfo').addEventListener('click', () => {
  showSide = !showSide;
  side.classList.toggle('hidden', !showSide);
});
viewer.addEventListener('click', e => { if (e.target === viewer) closeViewer(); });
document.addEventListener('keydown', e => {
  if (!viewer.classList.contains('show')) return;
  if (e.key === 'Escape') closeViewer();
  if (e.key === 'ArrowLeft') go(cur - 1);
  if (e.key === 'ArrowRight') go(cur + 1);
  if (e.key === 'i' || e.key === 'I') document.getElementById('btnInfo').click();
});
</script>
